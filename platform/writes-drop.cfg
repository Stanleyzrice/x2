\* 两个进程，拿写入锁的连接可能断（Drop）。已知破 RecordsTrue、TargetClear、NoRedoUnsettled，都是同一个空档：带着锁记完意图，到请求发到站点之间（代码里是几毫秒）锁没了，
\* 另一个进程拿到锁核清，读回来还没有，记成结果未知；人去站点看也还没有，记成被拒（再交就买重）；这时请求才到站点。要人在这几毫秒里看完、resolve，碰不到；站点自己不防重，去不掉。
\* 别的地方丢锁（核清、清待执行、记结果时）都停下，不破：改写入的每一句带着「锁还在」
CONSTANT Procs = {p1, p2}
CONSTANT MaxRows = 2
CONSTANT Lag = FALSE
SPECIFICATION Spec
INVARIANT OnePerKey NoRedoUnsettled TargetClear RecordsTrue
PROPERTY PendingEnds
CONSTANT Drop = TRUE
